name: CI

on:
  push:
    branches: [ "main", "master", "upgrade/v2" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install lightweight deps
      run: |
        python -m pip install --upgrade pip
        # 跳过 torch，只装测试和基础运行需要的包，防止超时
        pip install pytest pytest-cov ruff
        pip install streamlit openai python-docx pypdf
        
    - name: Lint with ruff
      working-directory: ./zhijing
      run: |
        ruff check . || true
        
    - name: Test with pytest
      working-directory: ./zhijing
      run: pytest --cov=core --cov-report=term-missing tests/